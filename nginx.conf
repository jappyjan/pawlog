server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml;

  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  # pdf.js ships its worker as .mjs; module scripts need a JavaScript MIME type.
  location ~* ^/assets/.+\.mjs$ { types { } default_type application/javascript; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }

  # SPA fallback
  location / { try_files $uri /index.html; }
}
